name: autogram
description: "Autogram v mobile"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.6.0+55

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  eidmsdk:
    git:
      url: https://github.com/slovensko-digital/eidmsdk-flutter
      ref: v1.0.0
  autogram_sign:
    git:
      url: https://github.com/slovensko-digital/avm-client-dart
      ref: v0.5.0
  device_info_plus: ^13.0.0
  package_info_plus:
  share_plus:
  wakelock_plus:
  flutter_svg:
  http:
  chopper: '>=7.4.0 <8.0.0'
  injectable:
  get_it:
  flutter_hooks:
  localstorage: '>=4.0.0 <5.0.0'
  pdf:
  printing:
  webview_flutter:
  webview_flutter_web:
  logging:
  path:
  path_provider:
  file_picker:
  flutter_bloc:
  provider:
  basic_utils:
  intl:
  dotted_border: ^3.0.0
  notified_preferences:
  widgetbook_annotation:
  widgetbook:
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  flutter_secure_storage: ^10.0.0
  pointycastle: ^4.0.0
  url_launcher:
  mobile_scanner: ^7.1.0
  html:
  flutter_markdown:
  markdown:

# TODO Remove when autogram_sign v0.5.0 is tagged
dependency_overrides:
  autogram_sign:
    path: ../avm-client-dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  test:
  build_runner:
  injectable_generator: ^2.2.0
  widgetbook_generator: ^3.7.0

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/menu.svg
    - assets/icons/qr_code_scanner.svg
    - assets/images/autogram_logo.png
    - assets/images/close.svg
    - assets/images/lock.svg
    - assets/images/notification.svg
    - assets/images/danger.svg
    - assets/images/info.svg
    - assets/images/tick.svg
  fonts:
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
        - asset: assets/fonts/SourceSans3-It.ttf
          style: italic
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourceSans3-BoldIt.ttf
          weight: 700
          style: italic
